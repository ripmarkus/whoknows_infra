name: Terraform

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    paths: ['terraform/**']

env:
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform -chdir=terraform init

      - name: Format check
        run: terraform -chdir=terraform fmt -check

      - name: Plan
        run: terraform -chdir=terraform plan -no-color 2>&1 | tee /tmp/plan.txt

      - name: Fail on destroy or replacement
        run: |
          if grep -qE '# .+ (will be destroyed|must be replaced)' /tmp/plan.txt; then
            echo "ERROR: plan contains destroy or replacement of resources"
            grep -E '# .+ (will be destroyed|must be replaced)' /tmp/plan.txt
            exit 1
          fi

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '```\n' + plan.slice(-60000) + '\n```',
            });

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform -chdir=terraform init

      - name: Apply
        run: terraform -chdir=terraform apply -auto-approve
